[package]
name = "data"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
chumsky = { version = "0.13.0", features = ["unstable"] }
hashbrown = { version = "0.17.0", features = ["serde"] }
itertools = "0.15.0"
libc = "0.2"
rayon = "1.10.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde-deserialize-duplicates = "0.1.2"
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde_yaml = "0.9.34"
strsim = "0.11.1"
indicatif = { version = "0.18.0", features = ["rayon"] }
data-lib = { version = "*", path = "../data-lib" }
slug = "0.1.6"
quick-xml = { version = "0.41.0" , features = ["serialize"] }
reqwest = { version = "0.13.1", features = ["json", "blocking"] }
tokei = "14.0.0"
dotenvy = "0.15.7"
glass-lint-core = { git = "https://github.com/mProjectsCode/glass-lint.git", rev = "fd7d9095f9f8181e01d3b1cc09abd325381980cd", package = "glass-lint-core" }
glass-lint-js = { git = "https://github.com/mProjectsCode/glass-lint.git", rev = "fd7d9095f9f8181e01d3b1cc09abd325381980cd", package = "glass-lint-js" }
glass-lint-obsidian = { git = "https://github.com/mProjectsCode/glass-lint.git", rev = "fd7d9095f9f8181e01d3b1cc09abd325381980cd", package = "glass-lint-obsidian" }

[dev-dependencies]
tempfile = "3.27.0"
