[package]
name = "data-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
chumsky = {version = "0.13.0", features = ["unstable"]}
hashbrown = {version = "0.17.0", features = ["serde"]}
js-sys = "0.3.77"
regex = "1.11.1"
serde = {version = "1.0.219", features = ["derive"]}
serde_json = {version = "1.0.140", features = ["raw_value"]}
thiserror = "2.0.12"
tsify = {version = "0.5.8", features = ["js"]}
wasm-bindgen = "0.2.101"
